apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.13.1
    helm:
      values: |
        controller:
          extraArgs:
            default-ssl-certificate: apps/k8s-certificate
          networkPolicy:
            enabled: true
          config:
            disable-access-log: "true"
            proxy-body-size: 1G
            proxy-request-buffering: "off"
            hsts-preload: "true"
          replicaCount: 2
        tcp:
          1080: apps/wireproxy:1080
          1081: apps/wireproxy:1081
          8080: apps/unifi:8080
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
