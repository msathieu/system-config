apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.14.0
    helm:
      values: |
        controller:
          extraArgs:
            default-ssl-certificate: apps/static-certificate
          networkPolicy:
            enabled: true
          config:
            add-headers: ingress-nginx/custom-headers
            disable-access-log: "true"
            error-log-level: crit
            proxy-body-size: 1G
            proxy-request-buffering: "off"
            force-ssl-redirect: "true"
            hsts-preload: "true"
            use-proxy-protocol: "true"
            ssl-protocols: TLSv1.3
            use-gzip: "true"
          replicaCount: 2
          service:
            loadBalancerIP: 192.168.253.30
            externalTrafficPolicy: Local
        tcp:
          1080: apps/wireproxy:1080
          1081: apps/wireproxy:1081
          2222: apps/forgejo:2222
          8612: apps/atlas-api:8612
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-headers
  namespace: ingress-nginx
data:
  X-Frame-Options: SAMEORIGIN
  X-Content-Type-Options: nosniff
  Referrer-Policy: no-referrer
