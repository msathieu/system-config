apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: barman
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://cloudnative-pg.github.io/charts
    chart: plugin-barman-cloud
    targetRevision: 0.4.0
  destination:
    server: https://kubernetes.default.svc
    namespace: cnpg-system
  syncPolicy:
    automated: {}
    syncOptions:
      - ServerSideApply=true
