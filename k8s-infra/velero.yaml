apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://vmware-tanzu.github.io/helm-charts
    chart: velero
    targetRevision: 12.0.0
    helm:
      values: |
        configuration:
          features: EnableCSI
          backupStorageLocation:
            - name: garage-replicated
              provider: aws
              bucket: velero
              credential:
                name: velero-garage-replicated
                key: config
              config:
                region: garage
                s3Url: http://backups-vm.apps.svc.cluster.local:3901
                s3ForcePathStyle: true
            - name: garage-local
              provider: aws
              bucket: velero
              credential:
                name: velero-garage-local
                key: config
              config:
                region: garage
                s3Url: http://backups-vm.apps.svc.cluster.local:3900
                s3ForcePathStyle: true
          volumeSnapshotLocation:
            - name: csi
              provider: csi
        kubectl:
          image:
            repository: public.ecr.aws/bitnami/kubectl
        deployNodeAgent: true
        initContainers:
          - name: velero-plugin-for-aws
            image: velero/velero-plugin-for-aws:v1.14.0
            volumeMounts:
              - name: plugins
                mountPath: /target
  destination:
    server: https://kubernetes.default.svc
    namespace: velero
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
