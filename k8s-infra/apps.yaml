apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://git.strypsteen.com/mathieu/system-config
    path: k8s-apps
  destination:
    server: https://kubernetes.default.svc
    namespace: services
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
