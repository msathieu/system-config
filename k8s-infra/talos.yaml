machine:
  install:
    # iscsi-tools, qemu-guest-agent, util-linux-tools
    image: factory.talos.dev/metal-installer-secureboot/88d1f7a5c4f1d3aba7df787c448c1d3d008ed29cfb34af53fa0df4336a56040b:v1.10.6
  systemDiskEncryption:
    state:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
    ephemeral:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
  network:
    kubespan:
      enabled: true
  sysctls:
    user.max_user_namespaces: 10000
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: custom
      urls:
        - https://raw.githubusercontent.com/projectcalico/calico/v3.30.2/manifests/canal.yaml
