machine:
  install:
    # intel-ucode, iscsi-tools, realtek-firmware, util-linux-tools
    image: factory.talos.dev/metal-installer-secureboot/ec3a78953a53ac0159d44d90c6f2c5068a9a7db7587e19678712da5451fed124:v1.10.6
  systemDiskEncryption:
    state:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
    ephemeral:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
  network:
    kubespan:
      enabled: true
  sysctls:
    user.max_user_namespaces: 10000
  time:
    bootTimeout: 1m
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
