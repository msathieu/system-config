machine:
  install:
    # intel-ucode, iscsi-tools, realtek-firmware, util-linux-tools
    image: factory.talos.dev/metal-installer-secureboot/ec3a78953a53ac0159d44d90c6f2c5068a9a7db7587e19678712da5451fed124:v1.10.7
  systemDiskEncryption:
    state:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
    ephemeral:
      provider: luks2
      keys:
        - slot: 0
          tpm: {}
  network:
    kubespan:
      enabled: true
  sysctls:
    user.max_user_namespaces: 10000
  time:
    bootTimeout: 1m
  files:
    - path: /etc/cri/conf.d/20-customization.part
      op: create
      content: |
        [plugins]
          [plugins."io.containerd.cri.v1.runtime"]
            device_ownership_from_security_context = true
cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: none
    podSubnets:
      - 10.244.0.0/16
      - fd08::/56
    serviceSubnets:
      - 10.96.0.0/12
      - fd09::/112
