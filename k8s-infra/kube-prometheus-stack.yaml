apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 77.0.2
    helm:
      releaseName: prometheus
      values: |
        prometheus:
          prometheusSpec:
            enableRemoteWriteReceiver: true
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 10Gi
        alertmanager:
          alertmanagerSpec:
            storage:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 1Gi
            secrets:
              - alertmanager
          config:
            global:
              smtp_from: monitoring@strypsteen.me
              smtp_smarthost: vps.strypsteen.com:465
              smtp_auth_username: monitoring
              smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager/smtp-password
              smtp_require_tls: false
            receivers:
              - name: "null"
              - name: email
                email_configs:
                  - to: mathieu@strypsteen.me
                    send_resolved: true
            route:
              receiver: email
        grafana:
          auth:
            disable_login_form: true
          persistence:
            enabled: true
          grafana.ini:
            analytics:
              reporting: false
            database:
              wal: true
            server:
              root_url: "https://monitoring.strypsteen.com"
          adminPassword: ""
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: privileged
  ignoreDifferences:
    - kind: Secret
      name: prometheus-grafana
      jsonPointers:
        - /data/admin-password
    - group: apps
      kind: Deployment
      name: prometheus-grafana
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
