apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway
  namespace: envoy-gateway-system
spec:
  telemetry:
    accessLog:
      disable: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    namespace: envoy-gateway-system
    name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/private-key-algorithm: ECDSA
spec:
  gatewayClassName: envoy
  addresses:
    - value: 192.168.253.34
  listeners:
    - name: forgejo-ssh
      protocol: TCP
      port: 2222
    - name: atlas-api
      protocol: TCP
      port: 8612
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
    - name: https-git
      protocol: HTTPS
      port: 443
      hostname: git.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-git.strypsteen.com
    - name: https-matrix
      protocol: HTTPS
      port: 443
      hostname: matrix.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-matrix.strypsteen.com
    - name: https-vault
      protocol: HTTPS
      port: 443
      hostname: vault.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-vault.strypsteen.com
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: auth.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-auth.strypsteen.com
    - name: https-cloud
      protocol: HTTPS
      port: 443
      hostname: cloud.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-cloud.strypsteen.com
    - name: https-console
      protocol: HTTPS
      port: 443
      hostname: console.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-console.strypsteen.com
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy
      namespace: apps
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: policy
  namespace: apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  tls:
    minVersion: "1.3"
  proxyProtocol:
    optional: true
  headers:
    lateResponseHeaders:
      set:
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: no-referrer
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains; preload"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: policy
  namespace: apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  compressor:
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
    - type: Zstd
      zstd: {}
