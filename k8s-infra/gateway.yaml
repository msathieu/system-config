---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-redirect
  namespace: envoy-gateway-system
spec:
  parentRefs:
    - name: envoy
      namespace: apps
      sectionName: http
    - name: envoy-internal
      namespace: apps
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: policy
  namespace: apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  tls:
    minVersion: "1.3"
  proxyProtocol:
    optional: true
  headers:
    earlyRequestHeaders:
      remove:
        - X-Forwarded-For
    lateResponseHeaders:
      set:
        - name: X-Frame-Options
          value: SAMEORIGIN
        - name: X-Content-Type-Options
          value: nosniff
        - name: Referrer-Policy
          value: no-referrer
        - name: Strict-Transport-Security
          value: "max-age=31536000; includeSubDomains; preload"
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: policy
  namespace: apps
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  compressor:
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
    - type: Zstd
      zstd: {}
