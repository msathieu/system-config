apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: gateway
  namespace: envoy-gateway-system
spec:
  telemetry:
    accessLog:
      disable: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    namespace: envoy-gateway-system
    name: gateway
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: apps
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/private-key-algorithm: ECDSA
spec:
  gatewayClassName: envoy
  addresses:
    - value: 192.168.253.34
  listeners:
    - name: forgejo-ssh
      protocol: TCP
      port: 2222
    - name: atlas-api
      protocol: TCP
      port: 8612
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: envoy-gateway-system
    - name: https-git
      protocol: HTTPS
      port: 443
      hostname: git.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-git.strypsteen.com
    - name: https-matrix
      protocol: HTTPS
      port: 443
      hostname: matrix.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-matrix.strypsteen.com
    - name: https-vault
      protocol: HTTPS
      port: 443
      hostname: vault.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-vault.strypsteen.com
    - name: https-auth
      protocol: HTTPS
      port: 443
      hostname: auth.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-auth.strypsteen.com
    - name: https-metrics
      protocol: HTTPS
      port: 443
      hostname: metrics.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-metrics.strypsteen.com
      allowedRoutes:
        namespaces:
          from: All
    - name: https-cloud
      protocol: HTTPS
      port: 443
      hostname: cloud.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-cloud.strypsteen.com
    - name: https-console
      protocol: HTTPS
      port: 443
      hostname: console.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-console.strypsteen.com
    - name: https-strypsteen-com
      protocol: HTTPS
      port: 443
      hostname: strypsteen.com
      tls:
        certificateRefs:
          - name: gw-strypsteen.com
    - name: https-strypsteen-me
      protocol: HTTPS
      port: 443
      hostname: strypsteen.me
      tls:
        certificateRefs:
          - name: gw-strypsteen.me
    - name: https-mta-sts-com
      protocol: HTTPS
      port: 443
      hostname: mta-sts.strypsteen.com
      tls:
        certificateRefs:
          - name: gw-mta-sts.strypsteen.com
    - name: https-mta-sts-me
      protocol: HTTPS
      port: 443
      hostname: mta-sts.strypsteen.me
      tls:
        certificateRefs:
          - name: gw-mta-sts.strypsteen.me
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
