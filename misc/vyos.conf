interfaces {
  ethernet eth0 {
    address dhcp
    ipv6 {
      address {
        autoconf
      }
    }
  }
  ethernet eth1 {
    address 192.168.255.1/24
    address fc00::1/64
  }
  ethernet eth2 {
    address 192.168.254.1/24
    address fc01::1/64
  }
  ethernet eth3 {
    address 192.168.253.1/24
    address fc02::1/64
  }
}
nat {
  source {
    rule 1 {
      outbound-interface {
        name eth0
      }
      translation {
        address masquerade
      }
    }
  }
}
nat66 {
  source {
    rule 1 {
      translation {
        address masquerade
      }
    }
  }
}
service {
  dhcp-server {
    shared-network-name mgmt {
      subnet 192.168.255.0/24 {
        option {
          default-router 192.168.255.1
          name-server 192.168.255.1
        }
        range 0 {
          start 192.168.255.2
          stop 192.168.255.254
        }
        subnet-id 1
      }
    }
    shared-network-name lan {
      subnet 192.168.254.0/24 {
        option {
          default-router 192.168.254.1
          name-server 192.168.254.1
        }
        range 0 {
          start 192.168.254.2
          stop 192.168.254.254
        }
        subnet-id 2
      }
    }
    shared-network-name server {
      subnet 192.168.253.0/24 {
        option {
          default-router 192.168.253.1
          name-server 192.168.253.1
        }
        range 0 {
          start 192.168.253.2
          stop 192.168.253.254
        }
        subnet-id 3
      }
    }
  }
  router-advert {
    interface eth1 {
      prefix ::/64 {
      }
    }
    interface eth2 {
      prefix ::/64 {
      }
    }
    interface eth3 {
      prefix ::/64 {
      }
    }
  }
  dns {
    forwarding {
      listen-address 0.0.0.0
      allow-from 192.168.0.0/16
      name-server 9.9.9.9 {
      }
    }
  }
  ssh {
    disable-password-authentication
  }
}
system {
  name-server 9.9.9.9
  time-zone Europe/Brussels
  sysctl {
    parameter net.ipv6.conf.eth0.use_tempaddr {
      value 2
    }
  }
}
