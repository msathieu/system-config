apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: synapse-db
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-standard-trixie
  instances: 2
  enablePDB: false
  storage:
    storageClass: local-path
    size: 30Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-replicated
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: synapse-db
spec:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 0 0 * * *"
  cluster:
    name: synapse-db
  backupOwnerReference: self
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: synapse
  labels:
    velero-backup: replicated
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 20Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: synapse-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: synapse-db
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: synapse
    - podSelector:
        matchLabels:
          cnpg.io/cluster: synapse-db
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: synapse
data:
  homeserver.yaml: |
    server_name: strypsteen.me
    public_baseurl: https://matrix.strypsteen.com/
    report_stats: false
    log_config: /etc/synapse/log_config.yaml
    signing_key_path: /data/signing.key
    media_store_path: /data/media
    listeners:
      - type: http
        bind_addresses: ['::']
        port: 8080
        x_forwarded: true
        resources:
          - names: [client, federation]
    trusted_key_servers:
      - server_name: matrix.org
    suppress_key_server_warning: true
    turn_uris: ['turn:turn.strypsteen.com']
    turn_allow_guests: false
    delete_stale_devices_after: 1y
    max_upload_size: 500M
  log_config.yaml: |
    version: 1
    root:
      level: WARNING
    disable_existing_loggers: False
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synapse
spec:
  selector:
    matchLabels:
      app: synapse
  template:
    metadata:
      name: synapse
      labels:
        app: synapse
    spec:
      runtimeClassName: gvisor
      volumes:
        - name: config
          configMap:
            name: synapse
        - name: config-secret
          secret:
            secretName: synapse
        - name: data
          persistentVolumeClaim:
            claimName: synapse
      containers:
        - name: synapse
          image: ghcr.io/element-hq/synapse:v1.148.0
          args: ['run', '--config-path', '/etc/synapse/homeserver.yaml', '--config-path', '/etc/synapse.yaml']
          env:
            - name: tmp_http_proxy
              value: http://k8s-gw-internal.strypsteen.com:1081
            - name: tmp_https_proxy
              value: http://k8s-gw-internal.strypsteen.com:1081
          volumeMounts:
            - name: config
              mountPath: /etc/synapse/homeserver.yaml
              subPath: homeserver.yaml
            - name: config
              mountPath: /etc/synapse/log_config.yaml
              subPath: log_config.yaml
            - name: config-secret
              mountPath: /etc/synapse.yaml
              subPath: synapse.yaml
            - name: data
              mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: synapse
spec:
  selector:
    app: synapse
  ports:
    - port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: synapse
spec:
  parentRefs:
    - name: envoy
  hostnames:
    - matrix.strypsteen.com
  rules:
    - backendRefs:
        - name: synapse
          port: 8080
