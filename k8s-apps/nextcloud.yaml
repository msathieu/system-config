apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-standard-trixie
  instances: 2
  enablePDB: false
  storage:
    storageClass: local-path
    size: 5Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-replicated
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: nextcloud-db
spec:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 0 0 * * *"
  cluster:
    name: nextcloud-db
  backupOwnerReference: self
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: nextcloud
spec:
  storageClassName: longhorn-custom
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nextcloud-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: nextcloud-db
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: nextcloud
    - podSelector:
        matchLabels:
          cnpg.io/cluster: nextcloud-db
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nextcloud
spec:
  selector:
    matchLabels:
      app: nextcloud
  template:
    metadata:
      name: nextcloud
      labels:
        app: nextcloud
    spec:
      hostUsers: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: nextcloud
      containers:
        - name: nextcloud
          image: docker.io/nextcloud:32.0.2
          command: ['sh', '-c', 'busybox crond && /entrypoint.sh apache2-foreground > /dev/null']
          env:
            - name: OVERWRITEPROTOCOL
              value: https
          volumeMounts:
            - name: data
              mountPath: /var/www/html
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud
spec:
  selector:
    app: nextcloud
  ports:
    - port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud
spec:
  parentRefs:
    - name: envoy
  hostnames:
    - cloud.strypsteen.com
  rules:
    - backendRefs:
        - name: nextcloud
          port: 80
