kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: anythingllm
  labels:
    velero-backup: replicated
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: anythingllm
spec:
  selector:
    matchLabels:
      app: anythingllm
  template:
    metadata:
      name: anythingllm
      labels:
        app: anythingllm
    spec:
      securityContext:
        fsGroup: 1000
      runtimeClassName: gvisor
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: anythingllm
      containers:
        - name: anythingllm
          image: docker.io/mintplexlabs/anythingllm:1.11.2
          env:
            - name: STORAGE_DIR
              value: /app/server/storage
            - name: PROVIDER_SUPPORTS_NATIVE_TOOL_CALLING
              value: generic-openai,openrouter
          volumeMounts:
            - name: data
              subPath: storage
              mountPath: /app/server/storage
            - name: data
              subPath: .env
              mountPath: /app/server/.env
---
apiVersion: v1
kind: Service
metadata:
  name: anythingllm
spec:
  selector:
    app: anythingllm
  ports:
    - port: 3001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anythingllm
spec:
  parentRefs:
    - name: envoy-internal
  hostnames:
    - llm.strypsteen.com
  rules:
    - backendRefs:
        - name: anythingllm
          port: 3001
      timeouts:
        request: 600s
