kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: forgejo
  labels:
    velero-backup: replicated
spec:
  storageClassName: ceph-block
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo
data:
  forgejo.ini: |
    WORK_PATH = /var/lib/gitea
    [database]
    DB_TYPE = sqlite3
    [repository]
    DEFAULT_BRANCH = master
    [server]
    DOMAIN = git.strypsteen.com
    ROOT_URL = https://git.strypsteen.com/
    START_SSH_SERVER = true
    SSH_PORT = 2222
    [service]
    DISABLE_REGISTRATION = true
    [log]
    LEVEL = warn
    [security]
    INSTALL_LOCK = true
    INTERNAL_TOKEN_URI = file:/etc/forgejo-secret/token
    [oauth2]
    JWT_SECRET_URI = file:/etc/forgejo-secret/jwt-secret
    [indexer]
    REPO_INDEXER_ENABLED = true
    [cron]
    ENABLED = true
    [service]
    ENABLE_INTERNAL_SIGNIN = false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-anubis
data:
  config.yaml: |
    status_codes:
      CHALLENGE: 403
      DENY: 403
    bots:
      - import: (data)/common/keep-internet-working.yaml
      - name: allow_api
        expression: path.startsWith("/api/")
        action: ALLOW
      - name: allow_git
        expression: 'userAgent.contains("git") || userAgent.contains("Git")'
        action: ALLOW
      - name: default
        expression: 'true'
        action: WEIGH
        weight:
          adjust: 10
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: forgejo
spec:
  selector:
    matchLabels:
      app: forgejo
  template:
    metadata:
      name: forgejo
      labels:
        app: forgejo
    spec:
      runtimeClassName: gvisor
      volumes:
        - name: config
          configMap:
            name: forgejo
        - name: data
          persistentVolumeClaim:
            claimName: forgejo
        - name: secret
          secret:
            secretName: forgejo
        - name: anubis-config
          configMap:
            name: forgejo-anubis
      containers:
        - name: forgejo
          image: codeberg.org/forgejo/forgejo:14.0.3-rootless
          env:
            - name: GITEA_APP_INI
              value: /etc/forgejo.ini
          volumeMounts:
            - name: data
              mountPath: /var/lib/gitea
            - name: config
              mountPath: /etc/forgejo.ini
              subPath: forgejo.ini
            - name: secret
              mountPath: /etc/forgejo-secret
        - name: anubis
          image: ghcr.io/techarohq/anubis:v1.25.0
          env:
            - name: TARGET
              value: http://localhost:3000
            - name: POLICY_FNAME
              value: /config.yaml
          volumeMounts:
            - name: anubis-config
              mountPath: /config.yaml
              subPath: config.yaml
---
apiVersion: v1
kind: Service
metadata:
  name: forgejo
spec:
  selector:
    app: forgejo
  ports:
    - name: web
      port: 8923
    - name: ssh
      port: 2222
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: forgejo-ssh
spec:
  parentRefs:
    - name: envoy
      sectionName: forgejo-ssh
  rules:
    - backendRefs:
        - name: forgejo
          port: 2222
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
spec:
  parentRefs:
    - name: envoy
  hostnames:
    - git.strypsteen.com
  rules:
    - backendRefs:
        - name: forgejo
          port: 8923
      timeouts:
        request: 600s
