apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: atlas-db
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-standard-trixie
  instances: 2
  enablePDB: false
  storage:
    storageClass: local-path
    size: 5Gi
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-replicated
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: atlas-db
spec:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 0 0 * * *"
  cluster:
    name: atlas-db
  backupOwnerReference: self
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: atlas-db
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atlas-api
    - podSelector:
        matchLabels:
          app: atlas-master
    - podSelector:
        matchLabels:
          app: atlas-web
    - podSelector:
        matchLabels:
          app: atlas-devproxy
    - podSelector:
        matchLabels:
          cnpg.io/cluster: atlas-db
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atlas-valkey
spec:
  podSelector:
    matchLabels:
      app: atlas-valkey
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: atlas-api
    - podSelector:
        matchLabels:
          app: atlas-master
    - podSelector:
        matchLabels:
          app: atlas-web
    - podSelector:
        matchLabels:
          app: atlas-devproxy
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlas-valkey
spec:
  selector:
    matchLabels:
      app: atlas-valkey
  template:
    metadata:
      name: atlas-valkey
      labels:
        app: atlas-valkey
    spec:
      runtimeClassName: gvisor
      containers:
        - name: atlas-valkey
          image: docker.io/valkey/valkey:9.1.1
          command: ['/bin/sh', '-c', 'valkey-server --requirepass "$VALKEY_PASSWORD"']
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-valkey-password
                  key: password
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-api
  template:
    metadata:
      name: atlas-api
      labels:
        app: atlas-api
    spec:
      runtimeClassName: gvisor
      containers:
        - name: atlas-api
          image: git.strypsteen.com/infra/atlas
          command: ['/apiserver']
          env:
            - name: VALKEY_HOST
              value: atlas-valkey
            - name: DATABASE_HOST
              value: atlas-db-rw
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-db-app
                  key: password
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-valkey-password
                  key: password
      imagePullSecrets:
        - name: git-strypsteen-com
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: atlas-master
spec:
  selector:
    matchLabels:
      app: atlas-master
  template:
    metadata:
      name: atlas-master
      labels:
        app: atlas-master
    spec:
      serviceAccountName: atlas-master
      runtimeClassName: gvisor
      containers:
        - name: atlas-master
          image: git.strypsteen.com/infra/atlas
          command: ['/master']
          env:
            - name: VALKEY_HOST
              value: atlas-valkey
            - name: DATABASE_HOST
              value: atlas-db-rw
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-db-app
                  key: password
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-valkey-password
                  key: password
      imagePullSecrets:
        - name: git-strypsteen-com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-web
  template:
    metadata:
      name: atlas-web
      labels:
        app: atlas-web
    spec:
      runtimeClassName: gvisor
      containers:
        - name: atlas-web
          image: git.strypsteen.com/infra/atlas
          command: ['/webserver']
          env:
            - name: VALKEY_HOST
              value: atlas-valkey
            - name: DATABASE_HOST
              value: atlas-db-rw
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-db-app
                  key: password
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-valkey-password
                  key: password
      imagePullSecrets:
        - name: git-strypsteen-com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlas-devproxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: atlas-devproxy
  template:
    metadata:
      name: atlas-devproxy
      labels:
        app: atlas-devproxy
    spec:
      runtimeClassName: gvisor
      containers:
        - name: atlas-devproxy
          image: git.strypsteen.com/infra/atlas
          command: ['/devproxy']
          env:
            - name: VALKEY_HOST
              value: atlas-valkey
            - name: DATABASE_HOST
              value: atlas-db-rw
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-db-app
                  key: password
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: atlas-valkey-password
                  key: password
      imagePullSecrets:
        - name: git-strypsteen-com
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-valkey
spec:
  selector:
    app: atlas-valkey
  ports:
    - port: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-api
spec:
  selector:
    app: atlas-api
  ports:
    - port: 8612
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-web
spec:
  selector:
    app: atlas-web
  ports:
    - port: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: atlas-devproxy
spec:
  selector:
    app: atlas-devproxy
  ports:
    - port: 8001
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: atlas
spec:
  parentRefs:
    - name: envoy
      sectionName: atlas-api
  rules:
    - backendRefs:
        - name: atlas-api
          port: 8612
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas
spec:
  parentRefs:
    - name: envoy
  hostnames:
    - console.strypsteen.com
  rules:
    - backendRefs:
        - name: atlas-web
          port: 8000
      sessionPersistence:
        type: Cookie
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-devproxy
spec:
  parentRefs:
    - name: envoy
  hostnames:
    - "*.dev.console.strypsteen.com"
  rules:
    - backendRefs:
        - name: atlas-devproxy
          port: 8001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas-devproxy-proxy
spec:
  parentRefs:
    - name: envoy
  hostnames:
    - "*.devproxy.console.strypsteen.com"
  rules:
    - backendRefs:
        - name: atlas-devproxy
          port: 8001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: atlas-master
---
apiVersion: v1
kind: Namespace
metadata:
  name: atlas
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: atlas-master
  namespace: atlas
rules:
  - apiGroups: [""]
    resources:
      - persistentvolumeclaims
      - pods
      - pods/exec
      - services
    verbs:
      - get
      - watch
      - list
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: atlas-master
  namespace: atlas
subjects:
  - kind: ServiceAccount
    name: atlas-master
    namespace: apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: atlas-master
