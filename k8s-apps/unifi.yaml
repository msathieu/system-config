kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: unifi
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: unifi
spec:
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      name: unifi
      labels:
        app: unifi
    spec:
      hostUsers: false
      volumes:
        - name: cert
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: unifi
        - name: logs
          emptyDir: {}
      containers:
        - name: unifi
          image: docker.io/goofball222/unifi:9.5.21
          env:
            - name: DB_MONGO_LOCAL
              value: "false"
            - name: DB_MONGO_URI
              value: mongodb://unifi-mongodb/unifi
            - name: STATDB_MONGO_URI
              value: mongodb://unifi-mongodb/unifi_stat
          volumeMounts:
            - name: cert
              mountPath: /usr/lib/unifi/cert
            - name: data
              mountPath: /usr/lib/unifi/data
            - name: logs
              mountPath: /usr/lib/unifi/logs
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
spec:
  selector:
    app: unifi
  ports:
    - name: web
      port: 8443
    - name: device
      port: 8080
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: unifi
spec:
  endpoints:
    - fqdn:
        hostname: unifi.apps.svc.cluster.local
        port: 8443
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi
spec:
  parentRefs:
    - name: envoy-internal
  hostnames:
    - network.strypsteen.com
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: unifi
