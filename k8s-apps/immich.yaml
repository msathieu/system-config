apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16-0.3.0
  instances: 2
  enablePDB: false
  storage:
    storageClass: longhorn-single
    size: 10Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: immich
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: immich-db
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: immich
    - podSelector:
        matchLabels:
          cnpg.io/cluster: immich-db
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich
spec:
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      name: immich
      labels:
        app: immich
    spec:
      hostUsers: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v1.137.3
          env:
            - name: IMMICH_PORT
              value: "8080"
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: DB_HOSTNAME
              value: immich-db-rw
            - name: DB_USERNAME
              value: app
            - name: DB_DATABASE_NAME
              value: app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: immich
spec:
  selector:
    app: immich
  ports:
    - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: immich
  annotations:
    cert-manager.io/issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - k8s.strypsteen.com
      secretName: k8s-certificate
  rules:
    - host: photos.strypsteen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: immich
                port:
                  number: 8080
