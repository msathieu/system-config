apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
spec:
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.0-0.5.3
  instances: 2
  enablePDB: false
  storage:
    storageClass: local-path
    size: 10Gi
  postgresql:
    shared_preload_libraries:
      - vchord.so
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: garage-replicated
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-db
spec:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  schedule: "0 0 0 * * *"
  cluster:
    name: immich-db
  backupOwnerReference: self
---
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: immich
spec:
  storageClassName: longhorn-custom
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: immich-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: immich-db
  policyTypes:
    - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: immich
    - podSelector:
        matchLabels:
          cnpg.io/cluster: immich-db
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: cnpg-system
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: immich
spec:
  selector:
    matchLabels:
      app: immich
  template:
    metadata:
      name: immich
      labels:
        app: immich
    spec:
      hostUsers: false
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: immich
      containers:
        - name: immich
          image: ghcr.io/immich-app/immich-server:v2.3.1
          env:
            - name: IMMICH_PORT
              value: "8080"
            - name: REDIS_HOSTNAME
              value: immich-valkey
            - name: DB_HOSTNAME
              value: immich-db-rw
            - name: DB_USERNAME
              value: app
            - name: DB_DATABASE_NAME
              value: app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: immich-db-app
                  key: password
          volumeMounts:
            - name: data
              mountPath: /data
---
apiVersion: v1
kind: Service
metadata:
  name: immich
spec:
  selector:
    app: immich
  ports:
    - port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
spec:
  parentRefs:
    - name: envoy-internal
  hostnames:
    - photos.strypsteen.com
  rules:
    - backendRefs:
        - name: immich
          port: 8080
