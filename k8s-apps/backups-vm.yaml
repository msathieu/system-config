apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: backups
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: backups-vm
    spec:
      domain:
        cpu:
          cores: 4
          model: host-passthrough
        resources:
          requests:
            memory: 4G
        devices:
          disks:
            #- name: installer
            #  disk:
            #    bus: virtio
            - name: ignition
              disk:
                bus: virtio
          rng: {}
          hostDevices:
            - name: storage
              deviceName: kubevirt.io/backups-storage
          tpm:
            persistent: true
        features:
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
      volumes:
        #- name: installer
        #  containerDisk:
        #    image: quay.io/fedora/fedora-coreos-kubevirt:stable
        - name: ignition
          cloudInitConfigDrive:
            secretRef:
              name: backups-vm
---
apiVersion: v1
kind: Service
metadata:
  name: backups-vm
spec:
  selector:
    app: backups-vm
  ports:
    - name: minio
      port: 9000
    - name: minio-web
      port: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: backups-vm-ssh
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.253.32
  selector:
    app: backups-vm
  ports:
    - port: 22
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backups-vm
spec:
  podSelector:
    matchLabels:
      app: backups-vm
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 22
        - port: 9000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: backups-vm
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/private-key-algorithm: ECDSA
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/16
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - backups.strypsteen.com
      secretName: backups-certificate
  rules:
    - host: backups.strypsteen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backups-vm
                port:
                  number: 9001
