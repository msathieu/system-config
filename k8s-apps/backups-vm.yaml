apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: backups
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: backups-vm
    spec:
      domain:
        cpu:
          cores: 2
          model: host-passthrough
        resources:
          requests:
            memory: 2Gi
        devices:
          disks:
            #- name: installer
            #  disk:
            #    bus: virtio
            - name: ignition
              disk:
                bus: virtio
          rng: {}
          hostDevices:
            - name: storage
              deviceName: kubevirt.io/backups-storage
          tpm:
            persistent: true
        features:
          smm:
            enabled: true
        firmware:
          bootloader:
            efi: {}
      volumes:
        #- name: installer
        #  containerDisk:
        #    image: quay.io/fedora/fedora-coreos-kubevirt:stable
        - name: ignition
          cloudInitConfigDrive:
            secretRef:
              name: backups-vm
---
apiVersion: v1
kind: Service
metadata:
  name: backups-vm
spec:
  selector:
    app: backups-vm
  ports:
    - name: garage-local
      port: 3900
    - name: garage-replicated
      port: 3901
---
apiVersion: v1
kind: Service
metadata:
  name: backups-vm-ssh
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.253.32
  selector:
    app: backups-vm
  ports:
    - port: 22
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backups-vm
spec:
  podSelector:
    matchLabels:
      app: backups-vm
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 22
        - port: 3900
        - port: 3901
