apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy
data:
  haproxy.cfg: |
    defaults
      timeout connect 10s
      timeout client 600s
      timeout server 600s
    frontend http-fe
      mode tcp
      bind :80
      bind :::80 v6only
      bind :180 accept-proxy
      default_backend http
    backend http
      mode tcp
      server k8s k8s.strypsteen.com:80 send-proxy-v2
    frontend https-fe
      mode tcp
      bind :443
      bind :::443 v6only
      bind :1443 accept-proxy
      default_backend https
    backend https
      mode tcp
      server k8s k8s.strypsteen.com:443 send-proxy-v2
    frontend no-proxy-fe
      mode tcp
      bind :::2222
      bind :::8612
      default_backend no-proxy
    backend no-proxy
      mode tcp
      server k8s k8s.strypsteen.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: haproxy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: haproxy
  template:
    metadata:
      name: haproxy
      labels:
        app: haproxy
    spec:
      hostUsers: false
      volumes:
        - name: config
          configMap:
            name: haproxy
      containers:
        - name: haproxy
          image: docker.io/haproxy:3.2.9
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.253.31
  selector:
    app: haproxy
  ports:
    - name: http
      port: 80
    - name: https
      port: 443
    - name: http-proxy
      port: 180
    - name: https-proxy
      port: 1443
    - name: forgejo-ssh
      port: 2222
    - name: atlas-api
      port: 8612
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: haproxy
spec:
  podSelector:
    matchLabels:
      app: haproxy
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 80
        - port: 443
        - port: 180
        - port: 1443
        - port: 2222
        - port: 8612
