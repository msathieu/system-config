kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: gpu-vm
spec:
  storageClassName: longhorn-single
  volumeMode: Block
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Ti
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: gpu
spec:
  runStrategy: Always
  template:
    metadata:
      labels:
        app: gpu-vm
    spec:
      domain:
        cpu:
          cores: 14
          model: host-passthrough
        resources:
          requests:
            memory: 24G
        devices:
          disks:
            - name: disk
              disk:
                bus: virtio
          rng: {}
          gpus:
            - name: gpu
              deviceName: kubevirt.io/gpu
          autoattachGraphicsDevice: false
        features:
          smm:
            enabled: true
        firmware:
          bootloader:
            efi:
              persistent: true
      volumes:
        - name: disk
          persistentVolumeClaim:
            claimName: gpu-vm
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-vm
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  loadBalancerIP: 192.168.253.33
  selector:
    app: gpu-vm
  ports:
    - name: ssh
      port: 22
    - name: sunshine-1
      port: 47984
    - name: sunshine-2
      port: 47989
    - name: sunshine-3
      port: 48010
    - name: sunshine-4
      protocol: UDP
      port: 47998
    - name: sunshine-5
      protocol: UDP
      port: 47999
    - name: sunshine-6
      protocol: UDP
      port: 48000
    - name: sunshine-7
      protocol: UDP
      port: 48002
    - name: sunshine-8
      protocol: UDP
      port: 48010
---
apiVersion: v1
kind: Service
metadata:
  name: gpu-vm-internal
spec:
  selector:
    app: gpu-vm
  ports:
    - name: sunshine
      port: 47990
    - name: ollama
      port: 11434
    - name: invokeai
      port: 9090
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gpu-vm
spec:
  podSelector:
    matchLabels:
      app: gpu-vm
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 22
        - port: 47984
        - port: 47989
        - port: 48010
        - protocol: UDP
          port: 47998
        - protocol: UDP
          port: 47999
        - protocol: UDP
          port: 48000
        - protocol: UDP
          port: 48002
        - protocol: UDP
          port: 48010

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sunshine
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/private-key-algorithm: ECDSA
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/16
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - remote-desktop.strypsteen.com
      secretName: remote-desktop-certificate
  rules:
    - host: remote-desktop.strypsteen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gpu-vm-internal
                port:
                  number: 47990
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ollama
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/private-key-algorithm: ECDSA
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/16
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - textgen.strypsteen.com
      secretName: textgen-certificate
  rules:
    - host: textgen.strypsteen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gpu-vm-internal
                port:
                  number: 11434
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: invokeai
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/private-key-algorithm: ECDSA
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: invokeai-auth
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/16
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - imagegen.strypsteen.com
      secretName: imagegen-certificate
  rules:
    - host: imagegen.strypsteen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gpu-vm-internal
                port:
                  number: 9090
