apiVersion: apps/v1
kind: Deployment
metadata:
  name: collabora
spec:
  selector:
    matchLabels:
      app: collabora
  template:
    metadata:
      name: collabora
      labels:
        app: collabora
    spec:
      hostUsers: false
      volumes:
        - name: config
          configMap:
            name: collabora
      containers:
        - name: collabora
          image: docker.io/collabora/code:25.04.7.2.1
          volumeMounts:
            - name: config
              mountPath: /etc/coolwsd/coolwsd.xml
              subPath: coolwsd.xml
---
apiVersion: v1
kind: Service
metadata:
  name: collabora
spec:
  selector:
    app: collabora
  ports:
    - port: 9980
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabora
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    cert-manager.io/private-key-algorithm: ECDSA
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/whitelist-source-range: 192.168.0.0/16
spec:
  ingressClassName: nginx
  tls:
    - hosts:
      - office.strypsteen.com
      secretName: office-certificate
  rules:
    - host: office.strypsteen.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabora
                port:
                  number: 9980
