WORK_PATH = /var/lib/gitea
[database]
DB_TYPE = sqlite3
[repository]
DEFAULT_BRANCH = master
[server]
DOMAIN = git.strypsteen.me
ROOT_URL = https://git.strypsteen.me/
OFFLINE_MODE = true
[service]
DISABLE_REGISTRATION = true
[log]
LEVEL = warn
[security]
INSTALL_LOCK = true
INTERNAL_TOKEN_URI = file:/run/secrets/gitea-token
[oauth2]
ENABLE = false
