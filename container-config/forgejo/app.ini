WORK_PATH = /var/lib/gitea
[database]
DB_TYPE = sqlite3
[repository]
DEFAULT_BRANCH = master
[server]
DOMAIN = git.strypsteen.com
ROOT_URL = https://git.strypsteen.com/
OFFLINE_MODE = true
START_SSH_SERVER = true
SSH_PORT = 2222
[service]
DISABLE_REGISTRATION = true
[log]
LEVEL = warn
[security]
INSTALL_LOCK = true
INTERNAL_TOKEN_URI = file:/run/secrets/forgejo-token
[oauth2]
ENABLED = false
[indexer]
REPO_INDEXER_ENABLED = true
